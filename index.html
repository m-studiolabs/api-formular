function applyRenumber(opts) {
  const { prefix, suffix, start, pad, range, from } = opts;
  const startIdx = range === 'from' ? Math.max(0, from - 1) : 0;
  let num = start;
  for (let i = startIdx; i < rows.length; i++) {
    rows[i].pozicia = prefix + String(num).padStart(pad, '0') + suffix;
    num++;
  }
  render();
  toast(`Prečíslované ${rows.length - startIdx} položiek`, 'ok');
}

function clearAll() {
  if (!confirm('Naozaj vymazať celý formulár?')) return;

// ══════════════════════════════════════════════════════
//  AUTOMATICKÁ ZÁLOHA (localStorage)
//  Poistka proti strate rozpracovanej rozpisky (pád PC, zavretá karta).
//  Záloha je len v tomto prehliadači na tomto PC – trvalé uloženie
//  stále zabezpečuje 💾 (súbor) alebo export.
// ══════════════════════════════════════════════════════
const AUTOSAVE_KEY = 'apiagra-rozpis-potrubia:autosave:v1';
const AUTOSAVE_INTERVAL_MS = 3 * 60 * 1000;   // záloha každé 3 minúty (len ak sa niečo zmenilo)

let autosaveArmed = false;     // zapne sa až po rozhodnutí o obnove (prázdny štart nesmie prepísať zálohu)
let autosaveLastJson = null;   // stav, ktorý je už zálohovaný alebo uložený v súbore
let autosaveOwnedAt = null;    // čas zálohy, ktorú zapísala (alebo prevzala) táto karta

// Aktuálny stav formulára – rovnaký formát ako súbor 💾
function collectState() {
  return {
    header: {
      zakazka: document.getElementById('h-zakazka').value,
      zariadenie: document.getElementById('h-zariadenie').value,
      tesnost: document.getElementById('h-tesnost').value,
      cislo: document.getElementById('h-cislo').value,
    },
    rows: rows,
    rowCounter: rowCounter,
  };
}

// Očistí načítané riadky (zo súboru alebo zo zálohy)
function sanitizeRows(list) {
  if (!Array.isArray(list)) return [];
  return list
    .filter(r => r && typeof r === 'object')
    .map(r => {
      // Návrhy vypočítané funkciou sa do JSON neuložia – takéto prázdne návrhy zahoď
      r._dimSuggestions = Array.isArray(r._dimSuggestions)
        ? r._dimSuggestions.filter(s => s && s.val !== undefined && s.val !== null)
        : [];
      ['priruba_C1', 'priruba_C2', 'priruba_C3'].forEach(k => {
        if (Object.prototype.hasOwnProperty.call(PRIRUBA_PREMENOVANIE, r[k])) r[k] = PRIRUBA_PREMENOVANIE[r[k]];
      });
      return r;
    });
}

// Nahrá stav do formulára (zo súboru alebo zo zálohy)
function applyState(data) {
  if (data.header) {
    document.getElementById('h-zakazka').value = data.header.zakazka || '';
    document.getElementById('h-zariadenie').value = data.header.zariadenie || '';
    document.getElementById('h-tesnost').value = data.header.tesnost || '';
    document.getElementById('h-cislo').value = data.header.cislo || '';
  }
  rows = sanitizeRows(data.rows);
  rowCounter = data.rowCounter || rows.length;
  document.getElementById('val-summary').style.display = 'none';
  headerChanged();
  render();
}

function rowHasContent(r) {
  if (!r) return false;
  const cols = ['pozicia', 'kod', 'poznamka', 'priruba_C1', 'priruba_C2', 'priruba_C3', ...PARAM_COLS];
  return cols.some(c => r[c] !== undefined && r[c] !== null && String(r[c]).trim() !== '');
}

function stateHasContent(state) {
  if (!state) return false;
  const h = state.header || {};
  if ([h.zakazka, h.zariadenie, h.tesnost, h.cislo].some(v => v && String(v).trim() !== '')) return true;
  return (state.rows || []).some(rowHasContent);
}

function autosaveFormatTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

// „dnes o 14:32" / „včera o 14:32" / „25.09.2026 o 14:32"
function autosaveDescribeTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const time = autosaveFormatTime(ts);
  if (sameDay(d, now)) return 'dnes o ' + time;
  if (sameDay(d, yesterday)) return 'včera o ' + time;
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}.${mm}.${d.getFullYear()} o ${time}`;
}

function setAutosaveStatus(text, isErr) {
  const el = document.getElementById('autosave-status');
  if (!el) return;
  el.textContent = text ? (isErr ? '⚠ ' : '✓ ') + text : '';
  el.classList.toggle('err', !!isErr);
}

function autosaveRead() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (!rec || !rec.data || !Array.isArray(rec.data.rows)) return null;
    return rec;
  } catch (e) {
    return null;
  }
}

// onlyIfOwned: nemaž zálohu, ktorú medzitým zapísala iná karta s inou rozpiskou
function autosaveRemove(onlyIfOwned) {
  try {
    if (onlyIfOwned) {
      const rec = autosaveRead();
      if (rec && rec.savedAt !== autosaveOwnedAt) { autosaveOwnedAt = null; return; }
    }
    localStorage.removeItem(AUTOSAVE_KEY);
  } catch (e) { /* úložisko nedostupné – nič na mazanie */ }
  autosaveOwnedAt = null;
}

function autosaveNow() {
  if (!autosaveArmed) return;

  let state, json;
  try {
    state = collectState();
    json = JSON.stringify(state);
  } catch (e) { return; }
  if (json === autosaveLastJson) return;          // nič nové na zálohovanie

  if (!stateHasContent(state)) {                   // prázdny formulár sa nezálohuje
    autosaveRemove(true);
    autosaveLastJson = json;
    setAutosaveStatus('');
    return;
  }

  const savedAt = Date.now();
  try {
    localStorage.setItem(AUTOSAVE_KEY, '{"v":1,"savedAt":' + savedAt + ',"data":' + json + '}');
    autosaveOwnedAt = savedAt;
    autosaveLastJson = json;
    setAutosaveStatus('Zálohované o ' + autosaveFormatTime(savedAt));
  } catch (e) {
    // Plné alebo zakázané úložisko prehliadača
    setAutosaveStatus('Záloha nedostupná', true);
  }
}

// Volané po úspešnom uložení do súboru, exporte alebo načítaní zo súboru:
// rozpiska je bezpečne v súbore → záloha v prehliadači sa zmaže
function markClean() {
  autosaveRemove(true);
  try { autosaveLastJson = JSON.stringify(collectState()); } catch (e) {}
  setAutosaveStatus('');
}

function armAutosave() {
  autosaveArmed = true;
  try { autosaveLastJson = JSON.stringify(collectState()); } catch (e) {}
}

    const lbl = document.createElement('span');
    lbl.style.color = '#6b7a8d';
    lbl.textContent = k + ': ';
    const val = document.createElement('b');
    val.textContent = v;
    line.append(lbl, val);
    info.appendChild(line);
  });

  const box = overlay.querySelector('#restore-box');
  const btnContinue = overlay.querySelector('#restore-continue');
  const btnNew = overlay.querySelector('#restore-new');

  // Kým je okno otvorené, fokus zostáva v ňom (Enter nesmie pridávať riadky v tabuľke)
  const trap = (e) => { if (!box.contains(e.target)) btnContinue.focus(); };
  document.addEventListener('focusin', trap, true);

  const close = () => {
    document.removeEventListener('focusin', trap, true);
    overlay.remove();
  };

  btnContinue.onclick = () => {
    close();
    applyState(rec.data);
    autosaveOwnedAt = rec.savedAt;   // záloha teraz patrí tejto karte
    armAutosave();
    setAutosaveStatus('Zálohované o ' + autosaveFormatTime(rec.savedAt));
    toast('Rozpracovaná rozpiska obnovená', 'ok');
  };

  btnNew.onclick = () => {
    close();
    autosaveRemove(false);
    armAutosave();
    const first = document.querySelector('#table-body [data-row="0"]');
    if (first) first.focus();
  };

  setTimeout(() => btnContinue.focus(), 0);
}

function initAutosave() {
  const rec = autosaveRead();
  if (rec && stateHasContent(rec.data)) {
    showRestorePrompt(rec);      // zálohovanie sa zapne až po voľbe používateľa
  } else {
    autosaveRemove(false);       // prázdna alebo poškodená záloha – uprac
    armAutosave();
  }

  // Záloha každé 3 minúty (zapíše sa len vtedy, keď sa niečo zmenilo)
  setInterval(autosaveNow, AUTOSAVE_INTERVAL_MS);

  // Pri zatvorení / skrytí karty ulož hneď, nech sa nestratí posledná práca
  window.addEventListener('pagehide', autosaveNow);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') autosaveNow();
  });
}

// ── INIT ────────────────────────────────────────────
render();
// Add a first empty row to start
addRow();
initAutosave();
</script>
</body>
</html>
